name: 'CI/CD'

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Make
        run: sudo apt-get install make

      - name: Install Dependencies
        run: make install

      - name: Lint
        run: ruff check challenge

      - name: Run Model & API Tests
        run: |
          make model-test
          make api-test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  build-and-deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_NAME: latam-mle-app-2026
      AR_REPO_NAME: latam-mle-app-repo-2026
      REGION: us-central1
      IMAGE_TAG: ${{ github.run_id }}-${{ github.sha }}

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Make
      run: sudo apt-get install make

    - name: Install Dependencies
      run: pip install -r requirements-test.txt

    - name: Set up Google Cloud SDK
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

    - name: Set up gcloud CLI
      run: |
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build Docker image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} .

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

    - name: Deploy to Google Cloud Run
      run: |
        gcloud run deploy ${{ env.APP_NAME }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --port 8000

    - name: Verify Service URL
      run: |
        URL=$(gcloud run services describe ${{ env.APP_NAME }} \
        --platform managed \
        --region ${{ env.REGION }} \
        --format="value(status.url)")
        echo "Service URL: $URL"
        curl -fsS "$URL/health"

    - name: Run Stress Test
      run: make stress-test

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-reports
        path: reports/
